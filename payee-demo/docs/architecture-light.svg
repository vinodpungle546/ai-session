<svg xmlns="http://www.w3.org/2000/svg" font-family="IBM Plex Sans, Helvetica Neue, Arial, sans-serif" viewBox="0 0 1060 792" role="img" width="100%" aria-label="Architecture of the payee disambiguation demo. A Streamlit UI calls a LangGraph agent. Four distinct agents make their own separate model calls: the resolver, the confidence judge, the independent verifier which exists only in multi-agent mode, and the question answerer. Structured payee records and a Chroma vector store supply data. OpenTelemetry spans export to Arize Phoenix or Langfuse.">
